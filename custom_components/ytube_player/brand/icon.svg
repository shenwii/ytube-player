<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: YouTube Red to Deep Crimson -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2B32"/>
      <stop offset="50%" stop-color="#E60000"/>
      <stop offset="100%" stop-color="#B30006"/>
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <radialGradient id="innerGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Wave/Accent Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFEBEB"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#730004" flood-opacity="0.5"/>
    </filter>
    
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#550003" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Card (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#innerGlow)"/>

  <!-- Audio Waveform Background Rings (Subtle opacity) -->
  <circle cx="230" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.15" stroke-dasharray="8 8"/>
  <circle cx="230" cy="256" r="175" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.1" stroke-dasharray="6 6"/>

  <g filter="url(#elementShadow)">
    <!-- Sleek Over-ear Headphone Arc -->
    <path d="M 120 256 A 110 110 0 0 1 340 256" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Left Ear Cup -->
    <rect x="106" y="240" width="22" height="52" rx="11" ry="11" fill="#FFFFFF"/>
    <!-- Right Ear Cup -->
    <rect x="332" y="240" width="22" height="52" rx="11" ry="11" fill="#FFFFFF"/>

    <!-- Central Rounded Play Triangle (YouTube DNA) with dynamic Audio equalizer bars integrated -->
    <!-- Triangle Path: centered at ~230, 260 -->
    <path d="M 195 190 C 195 182 204 177 211 181 L 305 243 C 312 247 312 257 305 261 L 211 323 C 204 327 195 322 195 314 Z" fill="url(#waveGrad)"/>

    <!-- Dynamic Audio Soundwaves radiating to the right -->
    <!-- Bar 1 -->
    <rect x="375" y="226" width="12" height="60" rx="6" ry="6" fill="#FFFFFF"/>
    <!-- Bar 2 -->
    <rect x="398" y="200" width="12" height="112" rx="6" ry="6" fill="#FFFFFF" fill-opacity="0.9"/>
    <!-- Bar 3 -->
    <rect x="421" y="235" width="12" height="42" rx="6" ry="6" fill="#FFFFFF" fill-opacity="0.75"/>
  </g>
</svg>