<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" width="1024" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2B32"/>
      <stop offset="50%" stop-color="#E60000"/>
      <stop offset="100%" stop-color="#B30006"/>
    </linearGradient>

    <radialGradient id="innerGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </radialGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFEBEB"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#730004" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Icon Container (200x200 centered at y=28) -->
  <g transform="translate(32, 28) scale(0.446)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="448" height="448" rx="112" ry="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="448" height="448" rx="112" ry="112" fill="url(#innerGlow)"/>

    <!-- Rings -->
    <circle cx="210" cy="224" r="130" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.15" stroke-dasharray="8 8"/>

    <!-- Headphone -->
    <path d="M 100 224 A 110 110 0 0 1 320 224" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <rect x="86" y="208" width="22" height="52" rx="11" ry="11" fill="#FFFFFF"/>
    <rect x="312" y="208" width="22" height="52" rx="11" ry="11" fill="#FFFFFF"/>

    <!-- Play Triangle -->
    <path d="M 175 158 C 175 150 184 145 191 149 L 285 211 C 292 215 292 225 285 229 L 191 291 C 184 295 175 290 175 282 Z" fill="url(#waveGrad)"/>

    <!-- Audio Soundwaves -->
    <rect x="355" y="194" width="12" height="60" rx="6" ry="6" fill="#FFFFFF"/>
    <rect x="378" y="168" width="12" height="112" rx="6" ry="6" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="401" y="203" width="12" height="42" rx="6" ry="6" fill="#FFFFFF" fill-opacity="0.75"/>
  </g>

  <!-- Right Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Main Title -->
    <text x="265" y="125" font-size="74" font-weight="800" fill="#E60000" letter-spacing="-1">YouTube</text>
    <text x="590" y="125" font-size="74" font-weight="300" fill="#212121" letter-spacing="0">Player</text>

    <!-- Subtitle / Tagline -->
    <text x="270" y="180" font-size="22" font-weight="600" fill="#757575" letter-spacing="4">AUDIO STREAM MEDIA SOURCE</text>
    <text x="270" y="210" font-size="16" font-weight="500" fill="#9E9E9E" letter-spacing="2">HOME ASSISTANT CUSTOM INTEGRATION</text>
  </g>
</svg>
