search:
  name: Search YouTube
  description: Search YouTube for playable audio tracks and return matching items with media_content_id.
  fields:
    query:
      name: Query
      description: Search keywords (artist, song title, podcast, etc.).
      required: true
      example: "Lofi Hip Hop"
      selector:
        text:
    limit:
      name: Limit
      description: Maximum number of results to return (defaults to integration option).
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 50
          mode: box
